<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Positioning Example</title>

    <link rel="shortcut icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/normalize.css">

    <style>
        body {
            max-width: 650px;
            margin: 40px auto;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f4f8;
            border: 2px solid #1565c0;
            border-radius: 12px;
            position: relative;
        }

        main {
            padding: 10px;
        }

        h1 {
            color: #1565c0;
            margin-bottom: 20px;
        }

        ul {
            padding-left: 25px;
            line-height: 2;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            color: #008060;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover,
        a:focus {
            color: #e91e63;
            text-decoration: underline;
        }

        .date_passed {
            color: #777;
        }

        main p {
            margin-top: 20px;
            color: #374151;
        }

        aside {
            width: 145px;
            padding: 15px;
            background-color: #dbeafe;
            border: 2px solid #1565c0;
            border-radius: 8px;
            position: absolute;
            top: 100px;
            right: 20px;
        }

        aside p {
            margin: 0;
            line-height: 1.5;
        }

        aside a {
            color: #1d4ed8;
        }

        @media screen and (max-width: 600px) {
            body {
                margin: 15px;
                padding: 15px;
            }

            aside {
                position: static;
                width: auto;
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Meet This Season's Speakers</h1>

        <p>
            Discover inspiring talks from our special guest speakers.
        </p>

        <ul>
            <li>
                October:
                <a class="date_passed" href="speakers/toobin.html">
                    Jeffrey Toobin
                </a>
            </li>

            <li>
                November:
                <a class="date_passed" href="speakers/sorkin.html">
                    Andrew Ross Sorkin
                </a>
            </li>

            <li>
                January:
                <a href="speakers/chua.html">
                    Amy Chua
                </a>
            </li>
        </ul>

        <p>
            Interested in attending? Contact us to reserve your tickets.
        </p>
    </main>

    <aside>
        <p>
            <strong>Special Offer!</strong><br>
            <a href="raffle/html">Enter our raffle to win a free ticket.</a>
        </p>
    </aside>
</body>

</html>
